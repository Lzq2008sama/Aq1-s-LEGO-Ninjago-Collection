  <style>

    .sort button {

    .search {

    .list {

    .card {

    .backup {
      width: 100%;
      max-width: 660px;
      display: flex;
      gap: 10px;
      margin-top: 16px;
      justify-content: center;
    }

    .backup button {
      background: #1f2233;
      border: 1px solid #333a55;
      color: #9aa3c0;
      border-radius: 6px;
      padding: 8px 16px;
      cursor: pointer;

    }

    input[type="file"]::file-selector-button {
      background: #1f2233;
      color: #eee;
      border: 1px solid #333a55;
      border-radius: 6px;

      cursor: pointer;

    }

    }

    .cropper {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      z-index: 1000;
      touch-action: none;
    }

    .crop-title {
      color: #ccc;
      font-size: 14px;
    }

    .crop-box {
  position: relative;
}
.crop-cross {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 24px;
  height: 24px;
  pointer-events: none;
}
.crop-cross::before,
.crop-cross::after {
  content: '';
  position: absolute;
  background: rgba(255, 255, 255, 0.75);
}
.crop-cross::before {
  left: 0;
  right: 0;
  top: 50%;
  height: 1px;
}
.crop-cross::after {
  top: 0;
  bottom: 0;
  left: 50%;
  width: 1px;
}
    #cropCanvas {
      background: #12141f;
      border: 1px solid #f5c542;
      border-radius: 8px;
      cursor: grab;
    }

    .crop-btns {
      display: flex;
      gap: 10px;
    }

    .crop-btns button {
      background: #1f2233;
      border: 1px solid #333a55;
      color: #eee;

      cursor: pointer;
      font-size: 14px;

    }

    .empty {
      color: #666;

      }

      .roles button {

      }

      .roles button[data-role=""] {
        flex: 1;
        height: 38px;
        border-radius: 8px;
        padding: 0;
        font-size: 11px;
      }

    }
    }
  </style>
</head>
<body>
  <h1>
    <div class="logos">
      <img src="lego.png" class="logo">
      <img src="ninjago.png" class="logo">
    </div>
    <span class="title-text">阿琦的乐高忍者收藏册</span>
  </h1>
  <div class="sub">幻影旋转!</div>
  <div class="stats" id="stats">共 0 个人仔</div>

  <div class="form">
    <input class="name" id="inName" placeholder="人仔名字（如：初代赞）">
    <input class="no" id="inNo" placeholder="编号（如 njo001）">
    <input class="price" id="inPrice" type="number" step="0.01" min="0" placeholder="购入价（元）">
    <input class="note" id="inNote" placeholder="备注（可选）">
    <div class="photo-wrap">
      <input type="file" id="inPhoto" accept="image/*">
      <span>（可选）上传人仔照片，会自动压缩</span>
    </div>
    <button id="btnAdd">＋ 添加</button>
    <button id="btnCancel" style="display:none">取消</button>
  </div>

  <div class="roles">
    <button data-role="" class="on">全部</button>
    <button data-role="赞">赞 Zane<span class="cnt"></span></button>
    <button data-role="杰">杰 Jay<span class="cnt"></span></button>
    <button data-role="凯">凯 Kai<span class="cnt"></span></button>
    <button data-role="寇">寇 Cole<span class="cnt"></span></button>
    <button data-role="劳埃德">劳埃德 Lloyd<span class="cnt"></span></button>
    <button data-role="妮娅">妮娅 Nya<span class="cnt"></span></button>
    <button data-role="吴">吴 Wu<span class="cnt"></span></button>
    <button data-role="其他">其他<span class="cnt"></span></button>
  </div>
  <div class="sort">
    <button data-sort="default" class="on">默认</button>
    <button data-sort="asc">编号 ↑</button>
    <button data-sort="desc">编号 ↓</button>
  </div>
  <input class="search" id="inSearch" placeholder="🔍 搜索名字或备注…">

  <div class="list" id="list"></div>
  <!-- 裁剪窗口 -->
  <div class="cropper" id="cropper" style="display:none">
    <div class="crop-title">拖动图片调整位置，用 ＋/－ 缩放</div>
    <div class="crop-box">
  <canvas id="cropCanvas" width="300" height="300"></canvas>
  <div class="crop-cross"></div>
</div>
    <div class="crop-btns">
      <button id="cropZoomOut">－ 缩小</button>
      <button id="cropZoomIn">＋ 放大</button>
      <button id="cropOk">确定</button>
      <button id="cropCancel">取消</button>
    </div>
  </div>
  <div class="backup">
    <button id="btnExport">导出备份</button>
    <button id="btnImport">导入备份</button>
    <input type="file" id="importFile" accept=".json" style="display:none">
  </div>
  <!-- 点击图片后的大图预览 -->
  <div class="lightbox" id="lightbox" style="display:none">
    <img id="lightboxImg" src="" alt="">
    <div class="lightbox-bar">
      <a id="lightboxDownload" download="ninjago-fig.jpg">保存图片</a>
      <button id="lightboxClose">关闭</button>
    </div>
  </div>


<script>
    // ========== 1. 数据 ==========
    let figs = [];   // 先空数组，稍后从 IndexedDB 加载
    let db = null;   // 数据库连接

    // 打开数据库（IndexedDB 是"异步"的，要先"开门"）
    function openDB() {
      return new Promise((resolve) => {
        const req = indexedDB.open('ninjago_db', 1);
        req.onupgradeneeded = (e) => {
          const d = e.target.result;
          if (!d.objectStoreNames.contains('figs')) {
            d.createObjectStore('figs');
          }
        };
        req.onsuccess = (e) => { db = e.target.result; resolve(); };
        req.onerror = () => resolve();
      });
    }

    // 从 IndexedDB 读取收藏
    function loadFigs() {
      return new Promise((resolve) => {
        if (!db) { resolve([]); return; }
        const tx = db.transaction('figs', 'readonly');
        const req = tx.objectStore('figs').get('figs');
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = () => resolve([]);
      });
    }
    let sortMode = 'default';// 排序方式：default / asc / desc
    let editingId = null;   // 正在编辑的人仔 id，null 表示"添加模式"
    let activeRole = '';   // 当前选中的角色，空 = 全部
    const mainRoles = ['杰', '凯', '赞', '寇', '劳埃德', '妮娅', '吴'];  // 主角团（用来算"其他"）
    let pendingPhoto = null;   // 编辑时暂存的新照片 
    let pendingOriginal = null;   // 编辑时暂存的原图

    // ===== 裁剪器状态 =====
    let cropImg = null;        // 正在裁剪的图片
    let cropScale = 1;         // 缩放倍数
    let cropOffsetX = 0;       // 图片偏移 X
    let cropOffsetY = 0;       // 图片偏移 Y
    let cropCallback = null;   // 裁剪完成后的回调
    let cropDragging = false;  // 是否正在拖动
    let cropLastX = 0, cropLastY = 0;
    let cropStartOX = 0, cropStartOY = 0;
    // 每条：{ id, name, no, price, note, photo }

    const inName = document.getElementById('inName');
    const inPrice = document.getElementById('inPrice');
    const inNote = document.getElementById('inNote');
    const inPhoto = document.getElementById('inPhoto');
    const inNo = document.getElementById('inNo');
    const inSearch = document.getElementById('inSearch');
    const btnAdd = document.getElementById('btnAdd');
    const btnCancel = document.getElementById('btnCancel');
    const btnExport = document.getElementById('btnExport');
    const btnImport = document.getElementById('btnImport');
    const importFile = document.getElementById('importFile');
    // ===== 图片裁剪器 =====
    const cropper = document.getElementById('cropper');
    const cropCanvas = document.getElementById('cropCanvas');
    const cropCtx = cropCanvas.getContext('2d');

    // 打开裁剪器：图片短边填满裁剪框
    function openCropper(img, callback) {
      cropImg = img;
      cropCallback = callback;
      cropScale = 300 / Math.min(img.width, img.height);
      const dw = img.width * cropScale;
      const dh = img.height * cropScale;
      cropOffsetX = (300 - dw) / 2;
      cropOffsetY = (300 - dh) / 2;
      cropper.style.display = 'flex';
      drawCrop();
    }

    // 重绘裁剪框
    function drawCrop() {
      if (!cropImg) return;
      cropCtx.fillStyle = '#12141f';
      cropCtx.fillRect(0, 0, 300, 300);
      cropCtx.drawImage(cropImg, cropOffsetX, cropOffsetY, cropImg.width * cropScale, cropImg.height * cropScale);
    }

    // 缩放（以中心为基准）
    function zoomCrop(factor) {
      if (!cropImg) return;
      const newScale = Math.max(0.05, Math.min(6, cropScale * factor));
      const cx = 150 - cropOffsetX;
      const cy = 150 - cropOffsetY;
      cropOffsetX = 150 - cx * (newScale / cropScale);
      cropOffsetY = 150 - cy * (newScale / cropScale);
      cropScale = newScale;
      drawCrop();
    }

    // 压缩原图（保留大图，供以后重新裁剪）
function compressOriginal(img, callback) {
  const maxW = 1500;
  const scale = Math.min(1, maxW / img.width);
  const w = Math.max(1, Math.round(img.width * scale));
  const h = Math.max(1, Math.round(img.height * scale));
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  canvas.getContext('2d').drawImage(img, 0, 0, w, h);
  callback(canvas.toDataURL('image/jpeg', 0.75));
}

    // 读图片文件 -> 打开裁剪器
    function pickImage(file, callback) {
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      compressOriginal(img, (original) => {
        openCropper(img, (cropped) => callback(cropped, original));
      });
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}


    // 鼠标拖拽
    cropCanvas.addEventListener('mousedown', (e) => {
      cropDragging = true;
      cropLastX = e.clientX; cropLastY = e.clientY;
      cropStartOX = cropOffsetX; cropStartOY = cropOffsetY;
    });
    window.addEventListener('mousemove', (e) => {
      if (!cropDragging) return;
      cropOffsetX = cropStartOX + (e.clientX - cropLastX);
      cropOffsetY = cropStartOY + (e.clientY - cropLastY);
      drawCrop();
    });
    window.addEventListener('mouseup', () => { cropDragging = false; });

    // 手指拖拽（手机）
    cropCanvas.addEventListener('touchstart', (e) => {
      cropDragging = true;
      cropLastX = e.touches[0].clientX; cropLastY = e.touches[0].clientY;
      cropStartOX = cropOffsetX; cropStartOY = cropOffsetY;
      e.preventDefault();
    }, { passive: false });
    window.addEventListener('touchmove', (e) => {
      if (!cropDragging) return;
      cropOffsetX = cropStartOX + (e.touches[0].clientX - cropLastX);
      cropOffsetY = cropStartOY + (e.touches[0].clientY - cropLastY);
      drawCrop();
      e.preventDefault();
    }, { passive: false });
    window.addEventListener('touchend', () => { cropDragging = false; });

    // 确定：裁剪成 500x500 并输出
    document.getElementById('cropOk').addEventListener('click', () => {
      if (!cropImg) return;
      const srcW = 300 / cropScale;
      const srcH = 300 / cropScale;
      const srcX = -cropOffsetX / cropScale;
      const srcY = -cropOffsetY / cropScale;
      const out = document.createElement('canvas');
      out.width = 500; out.height = 500;
      out.getContext('2d').drawImage(cropImg, srcX, srcY, srcW, srcH, 0, 0, 500, 500);
      const dataUrl = out.toDataURL('image/jpeg', 0.85);
      cropper.style.display = 'none';
      cropImg = null;
      if (cropCallback) cropCallback(dataUrl);
    });

    // 取消
    document.getElementById('cropCancel').addEventListener('click', () => {
      cropper.style.display = 'none';
      cropImg = null;
    });

    // 缩放按钮
    document.getElementById('cropZoomIn').addEventListener('click', () => zoomCrop(1.2));
    document.getElementById('cropZoomOut').addEventListener('click', () => zoomCrop(1 / 1.2));
    const listEl = document.getElementById('list');
    const statsEl = document.getElementById('stats');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');
    const lightboxDownload = document.getElementById('lightboxDownload');
    const lightboxClose = document.getElementById('lightboxClose');

    // 导出备份：把收藏打包成一个文件下载
    function exportData() {
      const d = new Date();
      const name = '忍者收藏备份_' + d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate() + '.json';
      const blob = new Blob([JSON.stringify(figs)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = name;
      a.click();
      URL.revokeObjectURL(url);
    }

    // 导入备份：读文件内容，恢复收藏
    function importData(file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const data = JSON.parse(e.target.result);
          if (!Array.isArray(data)) { alert('文件格式不对'); return; }
          if (!confirm('导入会覆盖当前的 ' + figs.length + ' 个人仔，确定继续吗？')) return;
          figs = data;
          save();
          render();
          alert('导入成功！共 ' + figs.length + ' 个人仔');
        } catch (err) {
          alert('导入失败：文件不是有效的备份');
        }
      };
      reader.readAsText(file);
    }
    function save() {
      if (!db) return;
      const tx = db.transaction('figs', 'readwrite');
      tx.objectStore('figs').put(figs, 'figs');
    }
    function escapeHtml(str) {
      return String(str == null ? '' : str).replace(/[&<>"]/g, c => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]
      ));
    }


    // ========== 3. 渲染 ==========
    // 从编号里提取数字（"njo001" -> 1），没有编号返回 null
    function getNoNum(no) {
      const m = String(no || '').match(/(\d+)/);
      return m ? parseInt(m[1], 10) : null;
    }


    // 更新每个角色按钮上的"共 X 款"
    function updateRoleCounts() {
      document.querySelectorAll('.roles button').forEach(btn => {
        const role = btn.dataset.role;
        if (role === '') return;   // "全部"按钮跳过
        let list;
        if (role === '其他') {
          list = figs.filter(f => !mainRoles.some(r => String(f.name || '').includes(r)));
        } else {
          list = figs.filter(f => String(f.name || '').includes(role));
        }
        const cnt = btn.querySelector('.cnt');
        if (cnt) cnt.textContent = list.length + '款';
      });
    }
    function render() {
      const kw = inSearch.value.trim().toLowerCase();
      let filtered = figs.filter(f =>
        (String(f.name || '') + ' ' + String(f.note || '')).toLowerCase().includes(kw)
      );
      // 角色筛选：点"其他"= 排除主角团，其余 = 名字包含该角色
      if (activeRole === '其他') {
        filtered = filtered.filter(f => !mainRoles.some(r => String(f.name || '').includes(r)));
      } else if (activeRole) {
        filtered = filtered.filter(f => String(f.name || '').includes(activeRole));
      }
      // 排序：有编号的按数字排，没编号的排最后
      if (sortMode === 'asc' || sortMode === 'desc') {
        const dir = sortMode === 'asc' ? 1 : -1;
        const withNo = filtered.filter(f => getNoNum(f.no) !== null);
        const withoutNo = filtered.filter(f => getNoNum(f.no) === null);
        withNo.sort((a, b) => dir * (getNoNum(a.no) - getNoNum(b.no)));
        filtered = withNo.concat(withoutNo);
      }

      statsEl.textContent = '共 ' + figs.length + ' 个人仔';
      updateRoleCounts();

      if (filtered.length === 0) {
        listEl.innerHTML = '<div class="empty">还没有记录，从上面添加第一个人仔吧！</div>';
        return;
      }

      listEl.innerHTML = filtered.map(f => {
        // 正在编辑的这条 -> 原地展开成输入框
        if (f.id === editingId) {
          return `
            <div class="card editing">
              <div class="photo edit-photo-preview" data-id="${f.id}" title="点击重新裁剪">${f.photo ? '<img src="' + f.photo + '" alt="">' : '无图'}</div>
              <div class="info">
                <input class="edit-name" value="${escapeHtml(f.name)}" placeholder="名字">
                <input class="edit-no" value="${escapeHtml(f.no || '')}" placeholder="编号">
                <input class="edit-price" value="${f.price || ''}" placeholder="价格">
                <input class="edit-note" value="${escapeHtml(f.note || '')}" placeholder="备注">
                <label class="edit-photo-label">换图：<input type="file" class="edit-photo" accept="image/*"></label>
              </div>
              <button class="save" data-id="${f.id}">保存</button>
              <button class="cancel">取消</button>
            </div>`;
        }
        const priceHtml = f.price ? '<div class="p">购入价 ¥' + Number(f.price).toFixed(2) + '</div>' : '';
        const photoHtml = f.photo
          ? '<div class="photo"><img src="' + f.photo + '" alt=""></div>'
          : '<div class="photo">无图</div>';
        return `
          <div class="card">
            ${photoHtml}
            <div class="info">
              <div class="n">${escapeHtml(f.name)}${f.no ? ' <span class="no-tag">' + escapeHtml(f.no) + '</span>' : ''}</div>
              <div class="s">${escapeHtml(f.note || '—')}</div>
              ${priceHtml}
            </div>
            <button class="edit" data-id="${f.id}">编辑</button>
            <button class="del" data-id="${f.id}">删除</button>
          </div>`;
      }).join('');
    }

    // ========== 4. 添加 ==========
    function finishSave(photo, photoOriginal) {
      const name = inName.value.trim();
      if (!name) { alert('请先填写人仔名字哦～'); return; }
      const fig = {
        id: Date.now(),
        name: name,
        no: inNo.value.trim(),
        price: parseFloat(inPrice.value) || 0,
        note: inNote.value.trim(),
        photo: photo || '',
        photoOriginal: photoOriginal || ''

      };
      figs.push(fig);
      save();
      render();
      inName.value = ''; inNo.value = ''; inPrice.value = ''; inNote.value = ''; inPhoto.value = '';
      inName.focus();
    }


    function addFig() {
      const file = inPhoto.files[0];
      if (file) {
        pickImage(file, (dataUrl, original) => finishSave(dataUrl, original));
      } else {
        finishSave(undefined, undefined);
      }
    }


    // ========== 5. 删除 ==========
    listEl.addEventListener('click', (e) => {
            // 点编辑态照片 -> 重新裁剪
      const editPhoto = e.target.closest('.edit-photo-preview');
      if (editPhoto) {
        const fig = figs.find(f => f.id === Number(editPhoto.dataset.id));
        if (fig && fig.photo) {
          const img = new Image();
          img.onload = () => openCropper(img, (dataUrl) => {
            pendingPhoto = dataUrl;
            editPhoto.innerHTML = '<img src="' + dataUrl + '" alt="">';
          });
          img.src = fig.photoOriginal || fig.photo;
        }
        return;
      }

      // 点"编辑" -> 进入行内编辑
      const editBtn = e.target.closest('.edit');
      if (editBtn) {
        editingId = Number(editBtn.dataset.id);
        pendingPhoto = null;
        pendingOriginal = null;
        render();
        return;
      }
      // 点"保存" -> 读取输入框，更新这条记录
      const saveBtn = e.target.closest('.save');
      if (saveBtn) {
        const fig = figs.find(f => f.id === Number(saveBtn.dataset.id));
        if (fig) {
          const card = saveBtn.closest('.card');
          fig.name = card.querySelector('.edit-name').value.trim();
          fig.no = card.querySelector('.edit-no').value.trim();
          fig.price = parseFloat(card.querySelector('.edit-price').value) || 0;
          fig.note = card.querySelector('.edit-note').value.trim();
          if (pendingPhoto !== null) {
  fig.photo = pendingPhoto;
  fig.photoOriginal = pendingOriginal;
}
        }
        editingId = null;
        pendingPhoto = null;
        pendingOriginal = null;
        save();
        render();
        return;
      }
      // 点"取消" -> 退出编辑
      const cancelBtn = e.target.closest('.cancel');
      if (cancelBtn) {
        pendingPhoto = null;
        pendingOriginal = null;
        editingId = null;
        render();
        return;
      }
      const btn = e.target.closest('.del');
      if (btn) {
        figs = figs.filter(f => f.id !== Number(btn.dataset.id));
        save();
        render();
        return;
      }
      // 点缩略图 -> 放大查看
      const img = e.target.closest('.photo img');
      if (img) {
        lightboxImg.src = img.src;
        lightboxDownload.href = img.src;
        lightbox.style.display = 'flex';
      }


    });

    // ========== 6. 事件绑定 ==========
    btnAdd.addEventListener('click', addFig);
    btnExport.addEventListener('click', exportData);
    btnImport.addEventListener('click', () => importFile.click());
    importFile.addEventListener('change', () => {
      if (importFile.files[0]) importData(importFile.files[0]);
    });
    btnCancel.addEventListener('click', () => {
      editingId = null;
      btnAdd.textContent = '＋ 添加';
      btnCancel.style.display = 'none';
      inName.value = ''; inNo.value = ''; inPrice.value = ''; inNote.value = ''; inPhoto.value = '';
    });
    // 点弹窗背景或"关闭"按钮 -> 关掉大图
    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox || e.target === lightboxClose) {
        lightbox.style.display = 'none';
      }
    });

    // 角色标签：点击后筛选 + 高亮
    document.querySelectorAll('.roles button').forEach(btn => {
      btn.addEventListener('click', () => {
        activeRole = btn.dataset.role;
        document.querySelectorAll('.roles button').forEach(b => b.classList.remove('on'));
        btn.classList.add('on');
        render();
      });
    });
    // 排序按钮：点击后切换排序方式，并高亮当前按钮
    document.querySelectorAll('.sort button').forEach(btn => {
      btn.addEventListener('click', () => {
        sortMode = btn.dataset.sort;
        document.querySelectorAll('.sort button').forEach(b => b.classList.remove('on'));
        btn.classList.add('on');
        render();
      });
    });

    inName.addEventListener('keydown', (e) => { if (e.key === 'Enter') addFig(); });
    inSearch.addEventListener('input', render);
    // 编辑态换图：选新图后压缩 + 立即更新预览
    listEl.addEventListener('change', (e) => {
      const input = e.target.closest('.edit-photo');
      if (input && input.files[0]) {
        pickImage(input.files[0], (dataUrl, original) => {
          pendingPhoto = dataUrl;
          pendingOriginal = original;
          const card = input.closest('.card');
          const photoEl = card.querySelector('.photo');
          if (photoEl) photoEl.innerHTML = '<img src="' + dataUrl + '" alt="">';
        });
      }
    });

    openDB().then(() => loadFigs()).then((data) => {
      figs = data;
      render();
    });
  </script>
</body>

</html>
